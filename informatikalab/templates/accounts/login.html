{% extends 'base.html' %}
{% block title %}Tizimga kirish - InformatikaLab{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2.5rem auto;">
    <div class="card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-icon" style="width: 48px; height: 48px; margin: 0 auto 0.75rem auto; font-size: 1.25rem;">IL</div>
            <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--primary);">InformatikaLab</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
                Ta'lim platformasiga kirish
            </p>
        </div>

        <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Foydalanuvchi nomi (Login)</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Masalan: oqituvchi" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Parol</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Tizimga kirish</button>
        </form>
    </div>
</div>
{% endblock %}
